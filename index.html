<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ödev Teslim Formu</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .card { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 480px; }
    h2 { margin-top: 0; color: #2c3e50; text-align: center; margin-bottom: 24px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; color: #34495e; font-size: 14px; }
    input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid #cccccc; border-radius: 6px; font-size: 14px; outline: none; transition: border 0.2s; }
    input:focus, select:focus, textarea:focus { border-color: #3498db; }
    button { width: 100%; padding: 12px; background-color: #3498db; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background-color: #2980b9; }
    button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
    #status { margin-top: 15px; padding: 10px; border-radius: 6px; text-align: center; font-size: 14px; display: none; }
    .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>

<div class="card">
  <h2>Ödev Teslim Formu</h2>
  <form id="assignmentForm">
    <div class="form-group">
      <label for="studentName">Ad Soyad</label>
      <input type="text" id="studentName" required placeholder="Adınız ve Soyadınız">
    </div>

    <div class="form-group">
      <label for="studentClass">Sınıf / Şube</label>
      <select id="studentClass" required>
        <option value="">Seçiniz</option>
        <option value="9-A">9-A</option>
        <option value="10-A">10-A</option>
        <option value="11-A">11-A</option>
        <option value="12-A">12-A</option>
      </select>
    </div>

    <div class="form-group">
      <label for="assignmentTitle">Ödev Konusu / Adı</label>
      <input type="text" id="assignmentTitle" required placeholder="Örn: Fizik Kuvvet ve Hareket">
    </div>

    <div class="form-group">
      <label for="submissionLink">Ödev Dosya Bağlantısı (Drive / Link)</label>
      <input type="url" id="submissionLink" required placeholder="https://...">
    </div>

    <div class="form-group">
      <label for="notes">Notlar (İsteğe Bağlı)</label>
      <textarea id="notes" rows="3" placeholder="Eklemek istediğiniz bir not var mı?"></textarea>
    </div>

    <button type="submit" id="submitBtn">Gönder</button>
  </form>
  <div id="status"></div>
</div>

<script>
  const GOOGLE_SCRIPT_URL = "https://script.google.com/u/0/home/projects/18hMHWU7Re6rbI6JX9QIING9fK2HTNoRoOKLMx61V9x-jN2aFL_dqspMf/exec";

  document.getElementById('assignmentForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const submitBtn = document.getElementById('submitBtn');
    const statusDiv = document.getElementById('status');
    
    submitBtn.disabled = true;
    submitBtn.innerText = 'Gönderiliyor...';
    statusDiv.style.display = 'none';

    const payload = {
      studentName: document.getElementById('studentName').value,
      studentClass: document.getElementById('studentClass').value,
      assignmentTitle: document.getElementById('assignmentTitle').value,
      submissionLink: document.getElementById('submissionLink').value,
      notes: document.getElementById('notes').value
    };

    fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    .then(() => {
      statusDiv.className = 'success';
      statusDiv.innerText = 'Ödeviniz başarıyla iletildi!';
      statusDiv.style.display = 'block';
      document.getElementById('assignmentForm').reset();
    })
    .catch(error => {
      statusDiv.className = 'error';
      statusDiv.innerText = 'Bir hata oluştu. Lütfen tekrar deneyiniz.';
      statusDiv.style.display = 'block';
      console.error('Error:', error);
    })
    .finally(() => {
      submitBtn.disabled = false;
      submitBtn.innerText = 'Gönder';
    });
  });
</script>

</body>
</html>
